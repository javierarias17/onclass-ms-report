server:
  port: "${SERVER_PORT}"
spring:
  application:
    name: "onclass-ms-report"
  devtools:
    add-properties: false
  data:
    mongodb:
      uri: "${MONGODB_URI}"
  profiles:
    active: "${SPRING_PROFILES_ACTIVE}"
  kafka:
    consumer:
      bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS}"
      group-id: "onclass-ms-report"
      auto-offset-reset: earliest
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
adapters:
  kafka:
    consumer:
      topic: "${KAFKA_REPORT_TOPIC}"
